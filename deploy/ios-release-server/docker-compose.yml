# SparkyFitness sideload release server.
#
#   cp .env.example .env    # set PUBLIC_BASE_URL and GITHUB_REPO
#   docker compose up -d --build
#
# release-web serves source.json and the IPAs (read-only). release-publisher
# polls GitHub releases tagged sideload-v*, verifies the SHA-256 and publishes
# them. No inbound upload path exists; publishing manually is a CLI call:
#   docker compose run --rm -v /path/to/app.ipa:/in/app.ipa:ro \
#     release-publisher publish /in/app.ipa --notes "..."
name: sparky-release

services:
  release-web:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - release-data:/srv:ro
    # Bound to localhost by default; point your reverse proxy or
    # `tailscale serve --https=443 http://127.0.0.1:${RELEASE_WEB_PORT}` at it.
    ports:
      - "${RELEASE_WEB_BIND:-127.0.0.1}:${RELEASE_WEB_PORT:-8088}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/source.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  release-publisher:
    build:
      context: ../..
      dockerfile: deploy/ios-release-server/Dockerfile
    image: sparky-release-publisher:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - release-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  release-data:
