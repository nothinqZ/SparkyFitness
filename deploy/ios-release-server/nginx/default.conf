# Static file server for the AltSource and IPAs. TLS terminates at your
# reverse proxy (or `tailscale serve`); this listens on plain HTTP inside the
# Docker network only. Nothing here accepts uploads.
server {
    listen 8080;
    server_name _;
    root /srv/public;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Some users paste the landing-page URL into SideStore's Sources dialog.
    # SideStore then requests `/` expecting AltSource JSON, not HTML.
    location = / {
        if ($http_user_agent ~* "(SideStore|AltStore)") {
            rewrite ^/$ /source.json last;
        }
        try_files /index.html =404;
    }

    location = /source.json {
        default_type application/json;
        # SideStore polls this; never serve a stale release list.
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/releases/[^/]+/[^/]+\.ipa$ {
        # Release files are immutable: a new build gets a new directory.
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ \.sha256$ {
        default_type text/plain;
    }

    location = /state.json { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }
}
